# Window Switcher 配置参考 / Configuration reference
#
# 配置文件读取顺序：可执行文件同目录的 window-switcher.ini，随后是
# %LOCALAPPDATA%\WindowSwitcher\window-switcher.ini。
# Configuration lookup: window-switcher.ini beside the executable, then
# %LOCALAPPDATA%\WindowSwitcher\window-switcher.ini.
#
# 修改后如何生效由 [performance] config_reload 决定。默认 on-open 会在下一次
# 开始切换时检查并重启；watch 会监视文件并在稳定后自动重启；restart 需要手动重启。
# The [performance] config_reload setting controls activation. on-open (default)
# checks at the next switch sequence, watch reloads after a stable file change,
# and restart requires manually restarting the process.
#
# 布尔值可填写 yes/no、true/false、on/off 或 1/0。以下示例统一使用 yes/no。
# Boolean values accept yes/no, true/false, on/off, or 1/0.

# 配置格式版本。当前版本为 1。旧版本会在内存中迁移，不会改写原文件。
# 可填写：非负整数；正常情况下保持 1。
# Configuration format version. The current version is 1. Older files are
# migrated in memory and are not rewritten. Enter a non-negative integer.
config_version = 1

# 是否显示系统托盘图标。
# 可填写：yes（显示，默认）、no（隐藏）。隐藏后不能从托盘打开配置编辑器。
# Show the notification-area tray icon. Use yes (default) or no.
trayicon = yes

[startup]

# 启动时是否请求管理员权限。
# 可填写：yes（以管理员身份重新启动）、no（普通用户，默认）。
# 仅影响本程序权限，不会自动提升其他进程。
# Request administrator privileges at launch. Use yes or no (default).
# This changes the switcher's token only; it does not elevate other processes.
run_as_admin = no

[appearance]

# 面板定位显示器。
# 可填写：
#   cursor     = 面板打开时使用鼠标所在显示器（默认）
#   foreground = 使用前台窗口所在显示器
#   primary    = 始终使用主显示器
# Target monitor: cursor (default), foreground, or primary.
monitor = cursor

# 是否限制在显示器工作区内。
# 可填写：yes（使用 rcWork，避开任务栏，默认）、no（使用完整显示器区域）。
# Keep the panel inside the work area (yes, default) or use full monitor bounds (no).
use_work_area = yes

# 图标边长，单位为 DIP；程序会按目标显示器 DPI 换算为像素。
# 可填写范围：24-256；默认 64。数值越大，面板和资源占用通常越大。
# Icon edge length in DIP, scaled for the target monitor DPI. Range: 24-256.
icon_size = 64

# 图标与条目边界之间的内边距，单位为 DIP。
# 可填写范围：0-256；默认 4。0 表示图标尽量贴近条目边界。
# Padding between an icon and its item boundary in DIP. Range: 0-256.
icon_padding = 4

# 条目之间的间距，单位为 DIP。
# 可填写范围：0-256；默认 8。0 表示相邻条目紧贴。
# Gap between items in DIP. Range: 0-256.
item_gap = 8

# 面板内容与面板边缘之间的外边距，单位为 DIP。
# 可填写范围：0-256；默认 10。
# Padding between the content grid and the panel edge in DIP. Range: 0-256.
panel_padding = 10

# 面板最大宽度，单位为 DIP。
# 可填写范围：0-32768；0（默认）表示不额外限制，使用显示器可用宽度。
# 这是最大值，不是固定宽度；图标或网格会在空间不足时缩小或分页。
# Maximum panel width in DIP. Range: 0-32768; 0 (default) uses available width.
# This is a limit, not a fixed width; the layout may shrink or page when needed.
max_width = 0

# 面板最大高度，单位为 DIP。
# 可填写范围：0-32768；0（默认）表示不额外限制，使用显示器可用高度。
# Maximum panel height in DIP. Range: 0-32768; 0 (default) uses available height.
max_height = 0

# 面板布局方式。
# 可填写：
#   single-row = 单行显示；空间不足时缩小图标并按页切换（默认）
#   grid       = 在多行网格中显示
#   paged      = 保持图标尺寸，按页显示，默认一行
# Layout mode: single-row (default), grid, or paged.
layout = single-row

# 每页最大列数。
# 可填写范围：0-256；0（默认）表示根据可用空间自动计算。
# Maximum columns per page. Range: 0-256; 0 (default) means automatic.
max_columns = 0

# 每页最大行数。
# 可填写范围：0-256；0（默认）表示自动计算；paged 模式下 0 等同于一行。
# Maximum rows per page. Range: 0-256; 0 (default) means automatic;
# in paged mode, 0 defaults to one row.
max_rows = 0

# 背景色或跟随系统主题。
# 可填写：auto（跟随 Windows 明暗主题，默认）或 #RRGGBB，例如 #202020、#F2F2F2。
# Background tint: auto (follow the Windows theme, default) or #RRGGBB.
background_color = auto

# 背景透明度百分比。
# 可填写范围：0-100；100（默认）为不透明，0 为完全透明。
# 仅在 backdrop 为 alpha、blur、acrylic、mica 或 auto 且材质支持透明时生效；
# backdrop = none 或回退到 solid 时背景保持不透明。图标、选中项和 Badge 不受影响。
# Background opacity percentage. Range: 0-100; 100 (default) is opaque and
# 0 is fully transparent when an alpha-capable backdrop is active. With none or
# solid fallback, the background remains opaque. Icons, selection, and Badges remain opaque.
background_opacity = 100

# 背景材质模式。
# 可填写：
#   none    = 纯色背景，不使用透明材质（默认）
#   alpha   = 仅使用透明度，不模糊后方窗口
#   blur    = 请求传统 Blur Behind
#   acrylic = 请求 Acrylic；Windows 11 优先使用系统 Acrylic
#   mica    = 请求 Mica；不支持时按回退策略降级
#   auto    = 自动选择可用的 Acrylic/Mica 路径
# Background material: none (default), alpha, blur, acrylic, mica, or auto.
# background_opacity alone does not enable blur; use blur/acrylic/auto for blur.
backdrop = none

# 材质不可用时的回退策略。
# 可填写：alpha（保留透明度，不模糊，默认）或 solid（使用不透明纯色）。
# 远程桌面、DWM 关闭或旧系统可能触发此回退。
# Fallback when a material is unavailable: alpha (default) or solid.
backdrop_fallback = alpha

# 是否显示应用窗口数量 Badge。
# 可填写：yes（显示，默认）或 no（隐藏）。仅当同一应用有多个窗口时显示。
# Show the application window-count Badge. Use yes (default) or no.
show_badge = yes

# Badge 显示的最大数字。
# 可填写范围：2-9999；默认 99。超过上限时显示为“上限+”，例如 120 显示为 99+。
# Maximum Badge number. Range: 2-9999; default 99. Larger counts are shown
# as "limit+", for example 120 becomes 99+.
badge_max = 99

[localization]

# 界面语言。
# 可填写：
#   auto  = 根据 Windows 用户界面语言选择（默认；中文系统使用简体中文）
#   zh-CN = 简体中文
#   en-US = English
# Interface language: auto (default), zh-CN, or en-US.
language = auto

[performance]

# 面板关闭后保留的图标缓存条目数。
# 可填写范围：16-256；默认 256。较小值可降低长期内存占用，但可能增加再次打开时的图标读取。
# Number of icon-cache entries retained after the panel closes. Range: 16-256.
# A smaller value can reduce memory use but may cause more icon reloads.
icon_cache_limit = 256

# GDI+ 抗锯齿渲染倍率。
# 可填写：auto（使用默认高质量倍率 6）、1、2、4 或 6。
# 较低倍率通常减少首帧时间和绘制内存，但边缘平滑度会降低。
# Antialiasing render scale: auto (default, equivalent to 6), 1, 2, 4, or 6.
# Lower values usually reduce first-frame cost and memory at the expense of smoothness.
render_scale = auto

# 配置重新加载方式。
# 可填写：
#   restart = 不自动检查；手动重启后生效
#   on-open = 下一次开始切换时检查并重启（默认）
#   watch   = 每 250 ms 检查，文件稳定约 500 ms 后自动重启
# Configuration reload mode: restart, on-open (default), or watch.
config_reload = on-open

[switch-windows]

# 同一应用窗口切换热键。
# 格式：<modifier>+<key>；modifier 可为 alt、ctrl 或 win；多个热键用 || 分隔。
# 常用示例：alt+`（默认）、ctrl+space、win+q、alt+` || ctrl+space。
# Hotkey for switching windows of the same application. Use <modifier>+<key>
# with alt, ctrl, or win; separate multiple hotkeys with ||.
hotkey = alt+`

# 与热键冲突时禁用窗口切换的进程名。
# 可填写：以逗号分隔的可执行文件名，例如 game1.exe,game2.exe；留空表示不屏蔽。
# 比较不区分大小写。
# Executable names that disable this hotkey, comma-separated; for example
# game1.exe,game2.exe. Leave empty to disable no applications. Matching is case-insensitive.
blacklist =

# 是否忽略最小化窗口。
# 可填写：yes（不列出最小化窗口）或 no（默认，仍列出最小化窗口）。
# Ignore minimized windows: yes or no (default).
ignore_minimal = no

# 是否只切换当前虚拟桌面的窗口。
# 可填写：yes、no 或 auto。
# auto（默认）跟随 Windows“虚拟桌面上的 Alt+Tab”系统设置；yes/no 可强制覆盖。
# Restrict switching to the current virtual desktop: yes, no, or auto.
# auto (default) follows the Windows Alt+Tab virtual-desktop setting.
only_current_desktop = auto

[switch-apps]

# 是否启用应用切换（Alt+Tab 风格）。
# 可填写：yes（启用）或 no（默认，关闭）。启用后才注册本节 hotkey。
# Enable application switching. Use yes or no (default); the hotkey is registered
# only when this is enabled.
enable = no

# 应用切换热键。
# 格式与 [switch-windows] hotkey 相同；示例：alt+tab（默认）或 ctrl+tab || win+tab。
# Hotkey for switching applications. The format matches [switch-windows] hotkey.
hotkey = alt+tab

# 是否忽略最小化应用窗口。
# 可填写：yes 或 no（默认）。
# Ignore minimized application windows: yes or no (default).
ignore_minimal = no

# 自定义应用图标映射。
# 格式：app.exe=icon_path；多个映射用逗号或分号分隔；留空使用系统图标。
# 路径可以是绝对路径，或相对于该应用可执行文件所在目录的路径。
# 建议使用 .ico；其他文件必须是 Windows 可识别的图标资源，普通 PNG 可能无法加载。
# Override icons: app.exe=icon_path, separated by comma or semicolon.
# Paths may be absolute or relative to the application's executable directory.
# Example: notepad.exe=C:\Icons\notepad.ico, calc.exe=icons\calc.ico
override_icons =

# 是否只切换当前虚拟桌面的应用。
# 可填写：yes、no 或 auto；含义与 [switch-windows] 相同。
# Restrict application switching to the current virtual desktop: yes, no, or auto.
only_current_desktop = auto

[log]

# 日志级别。
# 可填写：off、error、warn、info（默认）、debug 或 trace。
# 生产环境建议使用 info；排查问题时可临时使用 debug 或 trace。
# Log level: off, error, warn, info (default), debug, or trace.
level = info

# 日志文件路径。
# 留空（默认）表示不写入文件；相对路径相对于 window-switcher.exe 所在目录。
# 示例：window-switcher.log 或 C:\Users\User\AppData\Local\Temp\window-switcher.log
# Log file path. Leave empty (default) to disable file logging. Relative paths
# are resolved next to window-switcher.exe.
path =
