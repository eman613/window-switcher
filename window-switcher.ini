; 配置说明：trayicon
; 本文件必须放在 window-switcher.exe 同目录。推荐使用 UTF-8 保存，兼容带 BOM 的 UTF-16。
; 启动时只补齐缺失项和中文说明，已有值、注释和未知项会保留，不会用默认模板覆盖。
; 每行设置使用“键 = 值”。节名、键名区分大小写。注释放在独立行，以 ; 或 # 开头。
; 布尔值可选 yes/true/on/1（开启）或 no/false/off/0（关闭），均使用小写。
; 默认值只用于缺失项。无效值会报告错误并保留文件；运行中校验失败时继续使用原配置。
; 是否显示系统托盘图标。默认 yes。关闭后可直接编辑本文件；退出可使用任务管理器。
; 本文件中的设置均在应用启动时读取；保存后是否自动生效由 auto_restart 控制。
trayicon = yes

; 配置说明：auto_restart
; 保存本文件后是否自动重启应用。默认 yes，可选上述布尔值。
; 监测文件内容，支持记事本、VS Code 等编辑器的原地保存和替换保存。
; 相同内容不会重启。启动补全不会造成重启循环。暂时空白、删除或校验失败时不重启。
; 设为 no 的这次保存仍会触发重启，之后停止监测。重新设为 yes 后需手动启动一次。
auto_restart = yes

; 配置说明：restart_delay_ms
; 最后一次内容变化后等待多久才校验并重启。单位毫秒，默认 1000，可选整数 200-10000。
; 另有最多约 250 毫秒的后台检测间隔。连续保存会重新计时，只在内容稳定后重启一次。
; 新进程等待旧进程退出后接管快捷键和托盘。值非法时不写回默认值。
restart_delay_ms = 1000

[switch-windows]

; 配置说明：switch-windows.hotkey
; 在同一应用的多个窗口之间切换。默认 alt+`。按住修饰键并重复按主键循环，Shift 反向。
; 格式为“一个修饰键 + 一个主键”，多个快捷键用 || 分隔，例如 alt+` || ctrl+f1。
; 修饰键可选 alt、ctrl、win。不能组合两个修饰键，也不要把 Shift 写进配置。
; 主键支持 a-z、0-9、f1-f12、tab、esc/escape、enter/return、space、bs/backspace、
; home、end、up、down、left、right、pageup、pagedown、insert、delete、capslock、
; numlock、scrolllock、prtsc/printscreen、menu，以及美式键盘的标点键。
; 标点可用 oem_minus、oem_plus、oem_1 至 oem_7、oem_comma、oem_period、oem_102。
; 加号键请写 oem_plus。键名不区分大小写，可带 vk_ 前缀。按物理扫描码识别键位。
; 留空使用默认热键；格式非法时报告错误，保留文件。
hotkey = alt+`

; 配置说明：switch-windows.blacklist
; 前台应用命中列表时暂停“同一应用内切换窗口”的快捷键。默认空，不排除任何应用。
; 不影响 switch-apps 跨应用切换热键，避免误以为加入列表后 Alt+Tab 也会停用。
; 使用 EXE 文件名，以英文逗号分隔，不区分大小写。例如 game1.exe,game2.exe。
; 仅支持完整文件名匹配，不支持通配符或窗口标题。不填写路径。
blacklist =

; 配置说明：switch-windows.ignore_minimal
; 是否排除已最小化的窗口。默认 no，可选上述布尔值。
ignore_minimal = no

; 配置说明：switch-windows.only_current_desktop
; 是否仅切换当前虚拟桌面的窗口。默认 auto。
; 可选 auto（跟随 Windows 的 Alt+Tab 虚拟桌面设置）、yes（仅当前）、no（所有桌面）。
; yes/no 也接受上述布尔别名。系统设置读取失败时 auto 使用“仅当前桌面”。
only_current_desktop = auto

[switch-apps]

; 配置说明：switch-apps.enable
; 是否启用本应用的跨应用切换面板。默认 no，可选上述布尔值。
; 设为 yes 后接管下面的 hotkey；默认接管 Alt+Tab。设为 no 时保留 Windows 原生 Alt+Tab。
; 启动补全不会将你已设置的 yes 改回 no。
enable = no

; 配置说明：switch-apps.hotkey
; 打开并循环选择跨应用切换面板。默认 alt+tab。按住修饰键继续循环，松开后激活所选窗口。
; 格式、主键和修饰键的可选项与 switch-windows.hotkey 相同，Shift 用于反向循环。
; 支持 || 分隔多组热键。留空使用默认值。建议避免与同应用窗口切换使用相同组合。
hotkey = alt+tab

; 配置说明：switch-apps.ignore_minimal
; 是否在应用列表及 Badge 计数中排除最小化窗口。默认 no，可选上述布尔值。
ignore_minimal = no

; 配置说明：switch-apps.override_icons
; 自定义应用图标。默认空，使用自动提取的图标。格式：app.exe=icon.ico,other.exe=icon.png。
; 条目以英文逗号或分号分隔。左侧是应用路径中的匹配文本，不区分大小写，按列表顺序首个命中。
; 右侧为 ICO/PNG 文件路径，可使用绝对路径；相对路径基于被匹配应用 EXE 所在目录。
; Windows 路径中的反斜杠按原样读取，无需写双反斜杠；UNC 路径可写 \\server\share\icon.ico。
; 路径可含空格，整项不要加额外引号；不展开环境变量。不支持在条目路径中使用逗号或分号。
; 图标无法读取时回退自动图标。条目缺少 =、匹配文本为空或图标路径为空时报告错误。
override_icons =

; 配置说明：switch-apps.show_badge
; 是否在应用图标右上角显示圆形窗口数量。默认 yes，可选上述布尔值。
; 数量来自当前可切换窗口列表，会受到最小化窗口和虚拟桌面过滤影响。0 或 1 个窗口时隐藏。
show_badge = yes

; 配置说明：switch-apps.badge_max
; Badge 完整显示的最大数量。默认 99，可选整数 2-9999，无单位。
; 超出时显示“上限+”，例如默认上限下 100 个窗口显示 99+。单窗口始终隐藏。
badge_max = 99

; 配置说明：switch-apps.badge_color
; 圆形 Badge 背景色。默认 #4C7094（低饱和蓝色），可选 #RRGGBB 或 RRGGBB 六位十六进制颜色。
; 不支持透明度或颜色名称。背景与文字应保持足够对比度；设置仅影响 Badge。
badge_color = #4C7094

; 配置说明：switch-apps.badge_text_color
; Badge 数字颜色。默认 #FFFFFF（白色），格式与 badge_color 相同。
; 默认颜色在明暗主题下相同，文字对比度达到 4.5:1。自定义配色需自行保持可读性。
badge_text_color = #FFFFFF

; 配置说明：switch-apps.badge_font_size
; Badge 数字字号。默认 12，可选整数 8-24，单位 DIP（96 DPI 下等于像素）。
; 正常图标按屏幕 DPI 缩放；图标因空间不足缩小时字号同比缩放。字体固定为 Segoe UI。
; 长数字会扩大圆的直径，空间仍不足时自动缩小字体，保持圆形且不越过图标。
badge_font_size = 12

; 配置说明：switch-apps.only_current_desktop
; 是否仅列出当前虚拟桌面的应用。默认 auto，可选 auto/yes/no，yes/no 接受上述布尔别名。
; auto 跟随 Windows 的 Alt+Tab 虚拟桌面设置；系统读取失败时使用“仅当前桌面”。
only_current_desktop = auto

[log]

; 配置说明：log.level
; 日志详细程度。默认 info，可选 off、error、warn、info、debug、trace，不区分大小写。
; off 关闭日志；error 仅错误；warn 加入警告；info 加入启动和重启；debug/trace 用于诊断。
; 需要同时设置下面的 path 才会写文件。非法等级报告错误，不改写你的配置。
level = info

; 配置说明：log.path
; 日志文件路径。默认空，不写日志文件。可选空、绝对路径或相对 EXE 目录的路径。
; 例如 window-switcher.log，或已有目录下的 D:\Logs\window-switcher.log。
; Windows/UNC 路径反斜杠按原样读取，空格无需额外转义，不展开环境变量。
; 日志追加写入，不会清空旧内容。父目录必须存在且可写，否则启动报告错误。
; 日志路径不能指向本 INI 文件，避免日志写入破坏配置。
; 诊断配置问题可设置 level = debug 和 path = window-switcher.log，修正后保存或重新启动。
path =
