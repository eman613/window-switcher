# 配置格式版本。旧配置会在内存中自动迁移，不会覆盖原文件。
# Configuration format version. Legacy files are migrated in memory.
config_version = 1

# 是否显示托盘图标：yes/no。
# Show the tray icon: yes/no.
trayicon = yes

[startup]

# 启动时是否请求管理员权限：yes/no。
# Request administrator privileges at launch: yes/no.
run_as_admin = no

[appearance]

# 面板所在显示器：cursor（鼠标）、foreground（前台窗口）、primary（主屏幕）。
# Target monitor: cursor, foreground, or primary.
monitor = cursor

# 是否避开任务栏等工作区外区域：yes/no。
# Keep the switcher inside the monitor work area instead of covering taskbars.
use_work_area = yes

# 以下尺寸单位均为 DIP，会根据目标显示器 DPI 自动缩放。
# Layout dimensions are device-independent pixels (DIP).
icon_size = 64
icon_padding = 4
item_gap = 8
panel_padding = 10

# 面板最大尺寸。0 表示使用目标显示器可用区域。
# Maximum panel dimensions in DIP. Use 0 for the available monitor area.
max_width = 0
max_height = 0

# 布局：single-row（单行）、grid（网格）、paged（分页）。
# Layout: single-row, grid, or paged.
# single-row shrinks to a safe minimum before paging.
# grid wraps across available rows. paged preserves icon size and defaults to one row.
layout = single-row

# 最大列数和行数。0 表示自动计算。
# Grid/page limits. Use 0 for automatic sizing.
max_columns = 0
max_rows = 0

# 背景颜色：auto 跟随 Windows 主题，或填写 #RRGGBB。
# Background tint: auto follows the Windows theme, or use #RRGGBB.
background_color = auto

# 背景透明度：0-100。只影响背景，不影响图标、选中态和 Badge。
# Background opacity from 0 to 100. Foreground items remain opaque.
background_opacity = 100

# 背景模式：none、alpha、blur、acrylic、mica、auto。
# Background mode: none, alpha, blur, acrylic, mica, or auto.
# none preserves the existing opaque background. auto prefers acrylic.
backdrop = none

# 材质不可用时的回退：alpha 或 solid。
# Fallback when a requested effect is unavailable: alpha or solid.
backdrop_fallback = alpha

# 应用窗口数量 Badge。badge_max 的有效范围为 2-9999。
# Application window-count Badge settings.
show_badge = yes
badge_max = 99

[localization]

# 界面语言：auto、zh-CN、en-US。
# Interface language: auto, zh-CN, or en-US.
language = auto

[performance]

# 面板关闭后保留的图标缓存上限：16-256。
# Retained icon cache limit after the panel closes: 16-256.
icon_cache_limit = 256

# 抗锯齿渲染倍率：auto、1、2、4、6。倍率越低，资源占用越少。
# Antialiasing render scale: auto, 1, 2, 4, or 6.
render_scale = auto

# 配置重载：restart（手动重启）、on-open（下次切换时重启）、watch（防抖监视并重启）。
# Configuration reload: restart, on-open, or watch.
config_reload = on-open

[switch-windows]

# 同一应用窗口切换热键。多个热键用 || 分隔。
# Hotkey to switch windows (multiple hotkeys can be separated by ||).
hotkey = alt+`

# 与热键冲突的应用进程名，使用逗号分隔。
# Executables that conflict with the hotkey, separated by commas.
# 示例 / Example: game1.exe,game2.exe
blacklist =

# 是否忽略最小化窗口：yes/no。
# Ignore minimized windows: yes/no.
ignore_minimal = no

# 是否只切换当前虚拟桌面：yes/no/auto。
# Switch to windows from only the current virtual desktops instead of all desktops.
# Defaults to match the Alt-Tab behavior of Windows:
# Settings > System > Multitasking > Virtual Desktops
only_current_desktop = auto

[switch-apps]

# 是否启用应用切换：yes/no。
# Enable application switching: yes/no.
enable = no

# 应用切换热键。多个热键用 || 分隔。
# Hotkey to switch apps (multiple hotkeys can be separated by ||).
hotkey = alt+tab

# 是否忽略最小化窗口：yes/no。
# Ignore minimized windows: yes/no.
ignore_minimal = no

# 自定义图标：app.exe=icon_path。多个项目用逗号或分号分隔。
# List of override icons, syntax: app1.exe=icon1.ico,app2.exe=icon2.png.
# The icon path can be a full path or a relative path to the app's directory.
# The icon format can be ico or png.
override_icons =

# 是否只切换当前虚拟桌面：yes/no/auto。
# Switch to apps from only the current virtual desktops instead of all desktops.
# Defaults to match the Alt-Tab behavior of Windows:
# Settings > System > Multitasking > Virtual Desktops
only_current_desktop = auto

[log]

# 日志级别：off、error、warn、info、debug、trace。
# Log level can be one of off,error,warn,info,debug,trace.
level = info

# 日志文件路径。留空表示不写入文件。
# Log file path. Leave empty to disable file logging.
# e.g.
#   window-switcher.log (located in the same directory as window-switcher.exe)
#   C:\Users\User\AppData\Local\Temp\window-switcher.log (or use a full path)
path =
