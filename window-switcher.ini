# Whether to show trayicon, yes/no
trayicon = yes

[startup]

# Whether to request administrator privileges when launching, yes/no
run_as_admin = no

[appearance]

# Target monitor: cursor, foreground, or primary.
monitor = cursor

# Keep the switcher inside the monitor work area instead of covering taskbars.
use_work_area = yes

# Layout dimensions are device-independent pixels (DIP).
icon_size = 64
icon_padding = 4
item_gap = 8
panel_padding = 10

# Maximum panel dimensions in DIP. Use 0 for the available monitor area.
max_width = 0
max_height = 0

# Layout: single-row, grid, or paged.
# single-row shrinks to a safe minimum before paging.
# grid wraps across available rows. paged preserves icon size and defaults to one row.
layout = single-row

# Grid/page limits. Use 0 for automatic sizing.
max_columns = 0
max_rows = 0

# Application window-count Badge settings.
show_badge = yes
badge_max = 99

[switch-windows]

# Hotkey to switch windows (multiple hotkeys can be separated by ||)
hotkey = alt+`

# List of hotkey conflict apps
# e.g. game1.exe,game2.exe
blacklist =

# Ignore minimal windows
ignore_minimal = no

# Switch to windows from only the current virtual desktops instead of all desktops.
# Defaults to match the Alt-Tab behavior of Windows:
# Settings > System > Multitasking > Virtual Desktops
only_current_desktop = auto

[switch-apps]

# Whether to enable switching apps
enable = no

# Hotkey to switch apps (multiple hotkeys can be separated by ||)
hotkey = alt+tab

# Ignore minimal windows
ignore_minimal = no

# List of override icons, syntax: app1.exe=icon1.ico,app2.exe=icon2.png.
# The icon path can be a full path or a relative path to the app's directory.
# The icon format can be ico or png.
override_icons =

# Switch to apps from only the current virtual desktops instead of all desktops.
# Defaults to match the Alt-Tab behavior of Windows:
# Settings > System > Multitasking > Virtual Desktops
only_current_desktop = auto

[log]

# Log level can be one of off,error,warn,info,debug,trace.
level = info

# Log file path.
# e.g.
#   window-switcher.log (located in the same directory as window-switcher.exe)
#   C:\Users\sigod\AppData\Local\Temp\window-switcher.log (or used the full path)
path =
