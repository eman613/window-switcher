name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh -NoProfile -NonInteractive -File {0}

jobs:
  quality:
    name: Quality (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    env:
      RUSTFLAGS: --deny warnings
      CARGO_TERM_COLOR: always
      CARGO_TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check formatting
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all --check
          exit $LASTEXITCODE

      - name: Test
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked --workspace --all-targets --target $env:CARGO_TARGET
          exit $LASTEXITCODE

      - name: Clippy
        run: |
          $ErrorActionPreference = 'Stop'
          cargo clippy --locked --workspace --all-targets --target $env:CARGO_TARGET -- -D warnings
          exit $LASTEXITCODE
