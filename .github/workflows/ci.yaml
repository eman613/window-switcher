name: CI

on:
  pull_request:
    branches:
    - '*'
  push:
    branches:
    - main

permissions:
  contents: read

jobs:
  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

    - name: RustSec dependency audit
      uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Capture RustSec audit evidence
      shell: bash
      run: |
        set -euo pipefail
        cargo audit --json --file Cargo.lock > rustsec-audit.json
        advisory_db="${CARGO_HOME:-$HOME/.cargo}/advisory-db"
        {
          printf 'audit_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'action_commit=%s\n' '69366f33c96575abad1ee0dba8212993eecbe998'
          printf 'cargo_lock_sha256=%s\n' "$(sha256sum Cargo.lock | cut -d' ' -f1)"
          if [ -d "$advisory_db/.git" ]; then
            printf 'advisory_db_commit=%s\n' "$(git -C "$advisory_db" rev-parse HEAD)"
          else
            printf 'advisory_db_commit=unknown\n'
          fi
        } > rustsec-audit-context.txt

    - name: Upload RustSec audit report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustsec-audit-${{ github.sha }}
        path: |
          rustsec-audit.json
          rustsec-audit-context.txt
        if-no-files-found: error
        retention-days: 14

  all:
    name: ${{ matrix.name }}
    needs: audit

    strategy:
      fail-fast: false
      matrix:
        include:
        - name: x64 quality
          target: x86_64-pc-windows-msvc
          toolchain: 1.98.0
          quality: true
        - name: ARM64 compile
          target: aarch64-pc-windows-msvc
          toolchain: 1.98.0
          quality: false
        - name: MSRV 1.85
          target: x86_64-pc-windows-msvc
          toolchain: 1.85.0
          quality: false

    runs-on: windows-latest

    env:
      MAX_RELEASE_SIZE_BYTES: 900000
      RUSTFLAGS: --deny warnings
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}-x86_64-pc-windows-msvc

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

    - name: Install Rust Toolchain Components
      uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1
      with:
        toolchain: ${{ matrix.toolchain }}
        targets: ${{ matrix.target }}
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      with:
        key: ${{ matrix.toolchain }}-${{ matrix.target }}

    - name: Test
      if: ${{ matrix.quality }}
      run: cargo test --locked --release --target=${{ matrix.target }} --workspace --all-targets

    - name: Clippy
      if: ${{ matrix.quality }}
      run: cargo clippy --locked --release --target=${{ matrix.target }} --workspace --all-targets -- -D warnings

    - name: Format
      if: ${{ matrix.quality }}
      run: cargo fmt --all --check

    - name: Installer regression tests
      if: ${{ matrix.quality }}
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File tools/test-install.ps1

    - name: Performance harness regression tests
      if: ${{ matrix.quality }}
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File tools/test-performance.ps1

    - name: Cross-target compile check
      if: ${{ !matrix.quality }}
      run: cargo check --locked --release --target=${{ matrix.target }} --workspace --all-targets

    - name: Build release
      run: cargo build --locked --release --package window-switcher --target=${{ matrix.target }}

    - name: Enforce release size budget
      if: ${{ matrix.quality }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $artifact = 'target/${{ matrix.target }}/release/window-switcher.exe'
        $size = (Get-Item -LiteralPath $artifact).Length
        $maximumSize = [long] $env:MAX_RELEASE_SIZE_BYTES
        $remaining = $maximumSize - $size
        "### Release size`n`n- ``window-switcher.exe``: $size bytes`n- budget: $maximumSize bytes`n- remaining: $remaining bytes" |
          Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        if ($size -gt $maximumSize) {
          throw "Release size $size bytes exceeds the $maximumSize byte budget."
        }
