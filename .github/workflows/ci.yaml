name: CI

on:
  pull_request:
    branches:
    - '*'
  push:
    branches:
    - main

jobs:
  all:
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - name: x64 quality
          target: x86_64-pc-windows-msvc
          toolchain: 1.98.0
          quality: true
        - name: ARM64 compile
          target: aarch64-pc-windows-msvc
          toolchain: 1.98.0
          quality: false
        - name: MSRV 1.85
          target: x86_64-pc-windows-msvc
          toolchain: 1.85.0
          quality: false

    runs-on: windows-latest

    env:
      MAX_RELEASE_SIZE_BYTES: 900000
      RUSTFLAGS: --deny warnings
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}-x86_64-pc-windows-msvc

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust Toolchain Components
      uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1
      with:
        toolchain: ${{ matrix.toolchain }}
        targets: ${{ matrix.target }}
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.toolchain }}-${{ matrix.target }}

    - name: Test
      if: ${{ matrix.quality }}
      run: cargo test --locked --release --target=${{ matrix.target }} --workspace --all-targets

    - name: Clippy
      if: ${{ matrix.quality }}
      run: cargo clippy --locked --release --target=${{ matrix.target }} --workspace --all-targets -- -D warnings

    - name: Format
      if: ${{ matrix.quality }}
      run: cargo fmt --all --check

    - name: Cross-target compile check
      if: ${{ !matrix.quality }}
      run: cargo check --locked --release --target=${{ matrix.target }} --workspace --all-targets

    - name: Build release
      run: cargo build --locked --release --package window-switcher --target=${{ matrix.target }}

    - name: Enforce release size budget
      if: ${{ matrix.quality }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $artifact = 'target/${{ matrix.target }}/release/window-switcher.exe'
        $size = (Get-Item -LiteralPath $artifact).Length
        $maximumSize = [long] $env:MAX_RELEASE_SIZE_BYTES
        $remaining = $maximumSize - $size
        "### Release size`n`n- ``window-switcher.exe``: $size bytes`n- budget: $maximumSize bytes`n- remaining: $remaining bytes" |
          Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        if ($size -gt $maximumSize) {
          throw "Release size $size bytes exceeds the $maximumSize byte budget."
        }
