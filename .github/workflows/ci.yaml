name: CI

on:
  pull_request:
    branches:
    - '*'
  push:
    branches:
    - main

jobs:
  all:
    name: All

    strategy:
      matrix:
        target:
        - x86_64-pc-windows-msvc
        include:
        - target: x86_64-pc-windows-msvc
          os: windows-latest

    runs-on: ${{matrix.os}}

    env:
      MAX_RELEASE_SIZE_BYTES: 900000
      RUSTFLAGS: --deny warnings

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust Toolchain Components
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@v2

    - name: Test
      run: cargo test --locked --target=${{ matrix.target }} --workspace --all-targets

    - name: Clippy
      run: cargo clippy --locked --target=${{ matrix.target }} --workspace --all-targets -- -D warnings

    - name: Format
      run: cargo fmt --all --check

    - name: Build release
      run: cargo build --locked --release --package window-switcher --target=${{ matrix.target }}

    - name: Enforce release size budget
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $artifact = 'target/${{ matrix.target }}/release/window-switcher.exe'
        $size = (Get-Item -LiteralPath $artifact).Length
        $maximumSize = [long] $env:MAX_RELEASE_SIZE_BYTES
        $remaining = $maximumSize - $size
        "### Release size`n`n- ``window-switcher.exe``: $size bytes`n- budget: $maximumSize bytes`n- remaining: $remaining bytes" |
          Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        if ($size -gt $maximumSize) {
          throw "Release size $size bytes exceeds the $maximumSize byte budget."
        }
